<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="card shadow p-4 custom-box">
        <div class="text-center mb-4">
            <h2 class="fw-bold">{{ esRegistro() ? 'Registrarse' : 'Iniciar sesión' }}</h2>
            <p class="text-muted">
                {{ esRegistro() ? 'Cree una cuenta para gestionar sus reseñas' : 'Ingrese sus datos para continuar' }}
            </p>
        </div>

        <form [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()">
            <div class="mb-3">
                <label for="email" class="form-label">Email / Usuario</label>
                <input class="form-control" formControlName="email" placeholder="correo@gmail.com" type="text" id="email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input class="form-control" formControlName="password" placeholder="Ingrese su contraseña" type="password" id="password">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                {{ esRegistro() ? 'Registrarse' : 'Iniciar sesión' }}
            </button>
        </form>

        <div class="text-center mt-3">
            <button type="button" class="btn btn-link text-decoration-none" (click)="toggleModo()">
                {{ esRegistro() ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate aquí' }}
            </button>
        </div>

        @if (mensajeExito()){
            <div class="alert alert-success mt-3 mb-0 text-center">
                {{ mensajeExito() }}
            </div>
        }

        @if (mensajeError()){
            <div class="alert alert-danger mt-3 mb-0 text-center">
                {{ mensajeError() }}
            </div>
        }
    </div>
</div>
